name: Scheduled 20% Table Reminder

on:
  schedule:
    # 台北時間 每週日 晚上 9:00 = UTC 13:00
    - cron: '0 13 * * 0'
  workflow_dispatch: # 允許手動觸發測試

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run send reminder script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_EXCLUDE_USERS: ${{ secrets.LINE_EXCLUDE_USERS }}
        run: node tools/send_line_reminder.js
